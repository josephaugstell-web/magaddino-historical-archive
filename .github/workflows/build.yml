name: Build searchable archive

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.py'
      - 'sources.json'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download OCR and generate website
        run: python build.py --base-url "https://magaddino-historical-archive.pages.dev"
      - name: Upload website to download
        uses: actions/upload-artifact@v4
        with:
          name: magaddino-website
          path: public/
          retention-days: 14
      - name: Upload OCR report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: public/build-report.json
