<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Magaddino Files</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#17110d;
 color:#f1dfbc;
 font-family:Georgia,serif;
}
header{
 padding:20px;
 text-align:center;
 background:#100c09;
 border-bottom:2px solid #67492f;
}
header h1{
 margin:0;
 font-size:clamp(28px,5vw,52px);
 letter-spacing:3px;
}
header p{
 font-size:12px;
 letter-spacing:3px;
}
main{
 min-height:85vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 background:radial-gradient(#57402c,#17110d);
}
.file{
 width:100%;
 max-width:1000px;
 padding:clamp(20px,5vw,65px);
 background:#d7bd91;
 color:#25190f;
 border:8px double #876c48;
 box-shadow:12px 15px 35px #0009;
 text-align:center;
}
.stamp{
 color:#991d14;
 border:5px solid #991d14;
 display:inline-block;
 padding:12px;
 font-weight:bold;
 font-size:clamp(20px,4vw,44px);
 transform:rotate(-4deg);
 margin:35px 0;
}
h2{
 font-size:clamp(35px,8vw,85px);
 margin:30px 0 0;
 letter-spacing:3px;
}
.sub{
 font-family:monospace;
 letter-spacing:4px;
 font-size:clamp(16px,3vw,27px);
}
.enter{
 display:block;
 max-width:550px;
 margin:35px auto 10px;
 padding:20px;
 background:#87180f;
 color:#fff0d0;
 border:4px solid #b68a55;
 border-radius:7px;
 text-decoration:none;
 font-size:clamp(21px,4vw,34px);
 font-weight:bold;
 box-shadow:5px 6px 0 #4b2d1b;
}
.enter:hover{
 background:#ad2819;
}
.note{
 margin-top:35px;
 font-family:monospace;
 font-size:12px;
 letter-spacing:2px;
}
</style>
</head>
<body>
<header>
<h1>THE MAGADDINO FILES</h1>
<p>HISTORICAL RECORDS ARCHIVE</p>
</header>
<main>
<section class="file">
<p>FEDERAL BUREAU OF INVESTIGATION</p>
<h2>MAGADDINO</h2>
<div class="sub">FILES.COM</div>
<div class="stamp">UNDER CONSTRUCTION</div>
<p>Historical documents and investigative records</p>
<a class="enter" href="https://magaddino-historical-archive.pages.dev/">
📁 ENTER ARCHIVE →
</a>
<div class="note">RESEARCH BY JOSEPH AUGSTELL</div>
</section>
</main>
</body>
</html>
